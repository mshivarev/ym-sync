# Builds the Windows installer, the CLI tools and the Android APK.
#
# A pushed tag `vX.Y.Z` builds everything and opens a *draft* release with the
# assets attached — nothing is public until the draft is published by hand.
# «Run workflow» on the Actions page builds the same assets without a release,
# for trying a branch.
#
# Secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           the updater key (contents of the .key file)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
#   ANDROID_KEYSTORE_BASE64             base64 of the release .jks
#   ANDROID_KEYSTORE_PASSWORD           store password
#   ANDROID_KEY_ALIAS                   key alias
#   ANDROID_KEY_PASSWORD                key password
# Without the Tauri key the installer has no .sig and the release step fails;
# without the Android ones the APK comes out unsigned.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        name: Read and check the version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          tauri=$(grep -m1 '"version"' crates/gui/tauri.conf.json | sed -E 's/.*: *"(.*)".*/\1/')
          android=$(grep -m1 'versionName' android/app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "Cargo $version · tauri $tauri · android $android"
          if [ "$version" != "$tauri" ] || [ "$version" != "$android" ]; then
            echo "::error::versions disagree"; exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: cargo test -p ymsync-proto -p ymsync-relay -p ymsync

      - name: Installer
        working-directory: crates/gui
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2 build

      - name: CLI and relay
        run: cargo build --release -p ymsync -p ymsync-relay

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
            target/release/ymsync.exe
            target/release/ymsync-relay.exe
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Rust core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 26 \
            -o crates/android/jniLibs build --release -p ymsync-android

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::no signing key — the APK will be unsigned"; exit 0
          fi
          echo "$KEYSTORE" | base64 -d > android/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: APK
        working-directory: android
        run: gradle assembleRelease --console=plain

      - name: Forget the key
        if: always()
        run: rm -f android/release.jks android/keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    needs: [version, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: built

      - name: Assets
        run: >
          python3 scripts/release_assets.py
          --version ${{ needs.version.outputs.version }}
          --windows built/windows --android built/android
          --notes release-notes/${{ needs.version.outputs.version }}.md
          --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.version.outputs.version }}
          path: dist/*

      - name: Draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          notes=release-notes/$VERSION.md
          [ -f "$notes" ] || { echo "Сборка $VERSION" > /tmp/notes.md; notes=/tmp/notes.md; }
          gh release create "v$VERSION" dist/* --draft --verify-tag \
            --title "ym-sync $VERSION" --notes-file "$notes"
