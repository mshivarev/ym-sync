[package]
name = "ymsync-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# cdylib for System.loadLibrary; rlib so the crate can also be unit-tested and
# depended on from the host.
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
jni = "0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time"] }
ymsync = { version = "0.1.0", path = "../app", default-features = false, features = ["tls-rustls"] }
ymsync-proto = { version = "0.1.0", path = "../proto" }

[dev-dependencies]
bytes = "1.12.1"
