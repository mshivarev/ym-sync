<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ym-sync</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>
    <div class="top">
      <div class="brand">ym&#8209;sync</div>
      <button id="disconnect" class="hidden">Отключиться</button>
      <div id="hosting" class="chip hidden" title="комнату держит это устройство"></div>
      <div id="status" class="status">не подключено</div>
    </div>

    <!-- Two ways into a room, and the same two fields for both: a room is a name
         and a password. Which button you press decides who runs the relay. -->
    <div id="setup" class="setup">
      <div class="line">
        <label for="room">комната</label>
        <input id="room" placeholder="home" title="имя комнаты; у всех участников оно должно совпадать" />
        <label for="password">пароль</label>
        <input id="password" placeholder="общий секрет комнаты" title="общий секрет: без него в комнату не войти, и он должен совпадать у всех" />
      </div>

      <div class="line">
        <label for="relay">адрес комнаты</label>
        <input id="relay" placeholder="ws://192.168.1.10:8787" title="адрес того, кто держит комнату" />
        <button id="find-rooms" title="спросить сеть, кто держит комнату">Комнаты</button>
        <select id="rooms" class="rooms hidden" title="найденные в сети комнаты"></select>
        <button id="connect" class="primary">Подключиться</button>
      </div>

      <div class="line">
        <label for="advertise">адрес этого ПК</label>
        <input id="advertise" placeholder="определю сам" title="какой адрес сообщать остальным, когда комнату держит этот ПК; заполните, если определился не тот — например на машине с VPN" />
        <span class="hint inline">комнату будет держать этот ПК</span>
        <button id="host">Хостить</button>
      </div>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2>Что играть</h2>

      <div class="row">
        <select id="kind" title="Источник очереди">
          <option value="search">поиск</option>
          <option value="album">альбом</option>
          <option value="playlist">плейлист</option>
          <option value="track">трек</option>
          <option value="wave">моя волна</option>
          <option value="likes">мне нравится</option>
        </select>
        <input id="source" placeholder="кино группа крови" />
        <button id="load">В очередь</button>
        <button id="play">Играть</button>
        <button id="wave" class="hidden" title="Волну можно выключить только с того устройства, которое её ведёт">Волна</button>
      </div>

      <div class="row">
        <input id="query" placeholder="найти треки…" />
        <button id="find">Найти</button>
      </div>

      <ul id="results" class="list"></ul>
      <p id="results-hint" class="hint">Клик по результату добавит трек в конец очереди.</p>
    </section>

    <section class="panel">
      <h2>Очередь <span id="queue-count" class="dim"></span></h2>

      <div class="row">
        <button id="dl-track" title="оставить текущий трек на этом устройстве">&#8595; трек</button>
        <button id="dl-queue" title="оставить всю очередь на этом устройстве">&#8595; очередь</button>
        <button id="dl-cancel" class="hidden" title="забыть всё, что ещё не скачалось">отменить</button>
      </div>

      <ul id="queue" class="list"></ul>
    </section>

    <section class="panel">
      <h2>На устройстве <span id="lib-count" class="dim"></span></h2>

      <div class="row">
        <button id="lib-play">Играть</button>
        <button id="lib-queue">В очередь</button>
        <button id="lib-refresh" title="перечитать папку с треками">&#8635;</button>
      </div>

      <ul id="library" class="list"></ul>
      <p id="lib-hint" class="hint"></p>
    </section>
  </main>

  <footer>
    <div class="now">
      <div id="title" class="title">—</div>
      <div id="subtitle" class="dim"></div>
    </div>

    <div class="transport">
      <button id="prev" title="предыдущий">&#9198;</button>
      <button id="toggle" class="primary" title="пауза / продолжить">&#9654;</button>
      <button id="next" title="следующий">&#9197;</button>
    </div>

    <div class="progress">
      <input id="seek" type="range" min="0" max="1000" value="0" title="позиция" />
      <div class="times">
        <span id="position">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="meters">
      <label class="volume">
        <span class="dim">громкость</span>
        <input id="volume" type="range" min="0" max="100" value="80" />
      </label>
      <div id="drift" class="drift hidden"></div>
    </div>
  </footer>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>

</html>
